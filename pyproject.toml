[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pngweights"
version = "0.2.0"
description = "Neural network weights quantized and packed into a valid PNG file"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.45"]
eval = ["torch>=2.1", "transformers>=4.45", "datasets"]
rans = ["constriction"]
dev = ["pytest"]

[project.scripts]
pngweights = "pngweights.__main__:main"

[tool.setuptools]
packages = ["pngweights"]
